# ==============================================================================
# Dataplex Business Glossary & Column Provenance Specification
# Aligned 1:1 with contract.odcs.yaml (8 Canonical Source Columns + 2 Derived)
# ==============================================================================
glossary:
  id: exchange-source-dictionary
  display_name: "Exchange Matching Engine Source Dictionary"
  description: >-
    Authoritative upstream data dictionary inherited deterministically from the
    Exchange Order Matching Engine wire specification (FIX 4.2 / OUCH). Governs
    the 8 physical wire fields across raw landing and curated analytical
    contract tables without AI guesswork.
  labels:
    domain: equities-market
    contract_version: v1-0-0
    governance_layer: source-producer

categories:
  - id: trade-identification
    display_name: "Trade Identification & Venue Metadata"
    description: >-
      Primary execution identifiers, exchange-listed security ticker symbols,
      and matching engine execution timestamps.
  - id: execution-economics
    display_name: "Execution Pricing & Volume Economics"
    description: >-
      Matched execution price, share quantity, and financial settlement
      valuation fields governed by exchange contract rules.
  - id: counterparty-clearing
    display_name: "Counterparty Clearing & Lifecycle Status"
    description: >-
      Clearing member participant identifiers and trade lifecycle settlement
      status codes used for market surveillance and anti-wash-trade checks.

terms:
  - id: trade-id
    column_name: trade_id
    category_id: trade-identification
    display_name: "trade_id"
    provenance_badge: "[Inherited: Upstream Source Dictionary]"
    source_spec_ref: "FIX 4.2 Tag 17 (ExecID) / contract.odcs.yaml#trade_id"
    description: >-
      Unique trade execution identifier (e.g. TR-SGX-20260914-001) assigned
      deterministically by the Exchange Order Matching Engine upon order match.
      Required primary key; must not be null.
    dq_rules:
      - "Completeness: trade_id primary key must not be null"

  - id: instrument-code
    column_name: instrument_code
    category_id: trade-identification
    display_name: "instrument_code"
    provenance_badge: "[Inherited: Upstream Source Dictionary]"
    source_spec_ref: "FIX 4.2 Tag 48 (SecurityID) / contract.odcs.yaml#instrument_code"
    description: >-
      Exchange-listed security ticker symbol (e.g. D05.SI, Z74.SI, O39.SI)
      identifying the traded equity instrument. Required field; must not be null.
    dq_rules:
      - "Completeness: instrument_code ticker must not be null"

  - id: price
    column_name: price
    category_id: execution-economics
    display_name: "price"
    provenance_badge: "[Inherited: Upstream Source Dictionary]"
    source_spec_ref: "FIX 4.2 Tag 31 (LastPx) / contract.odcs.yaml#price"
    description: >-
      Executed trade price per share in settlement currency (NUMERIC). Must not
      be null and must be strictly positive (price > 0).
    dq_rules:
      - "Completeness: execution price must not be null"
      - "Validity: Trade price must be strictly positive (> 0)"

  - id: volume
    column_name: volume
    category_id: execution-economics
    display_name: "volume"
    provenance_badge: "[Inherited: Upstream Source Dictionary]"
    source_spec_ref: "FIX 4.2 Tag 32 (LastQty) / contract.odcs.yaml#volume"
    description: >-
      Number of shares matched in the execution event (INT64). Must not be null
      and must be strictly positive (volume > 0).
    dq_rules:
      - "Completeness: traded share volume must not be null"
      - "Validity: Trade volume must be strictly positive (> 0)"

  - id: buyer-id
    column_name: buyer_id
    category_id: counterparty-clearing
    display_name: "buyer_id"
    provenance_badge: "[Inherited: Upstream Source Dictionary]"
    source_spec_ref: "Clearing Member Buy Account / contract.odcs.yaml#buyer_id"
    description: >-
      Clearing member participant identifier on the buy side of the matched
      trade. Subject to the anti-wash-trading integrity assertion
      (buyer_id != seller_id).
    dq_rules:
      - "Integrity: Anti-wash trading rule - buyer_id must not equal seller_id"

  - id: seller-id
    column_name: seller_id
    category_id: counterparty-clearing
    display_name: "seller_id"
    provenance_badge: "[Inherited: Upstream Source Dictionary]"
    source_spec_ref: "Clearing Member Sell Account / contract.odcs.yaml#seller_id"
    description: >-
      Clearing member participant identifier on the sell side of the matched
      trade. Subject to the anti-wash-trading integrity assertion
      (buyer_id != seller_id).
    dq_rules:
      - "Integrity: Anti-wash trading rule - buyer_id must not equal seller_id"

  - id: trade-timestamp
    column_name: trade_timestamp
    category_id: trade-identification
    display_name: "trade_timestamp"
    provenance_badge: "[Inherited: Upstream Source Dictionary]"
    source_spec_ref: "FIX 4.2 Tag 60 (TransactTime UTC) / contract.odcs.yaml#trade_timestamp"
    description: >-
      UTC timestamp recorded by the Exchange Matching Engine at order execution.
      Governed by the 2-hour freshness SLA (trade_timestamp >=
      TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)).
    dq_rules:
      - "Freshness SLA: Trade execution timestamp must be within 2 hours of current time"

  - id: trade-status
    column_name: trade_status
    category_id: counterparty-clearing
    display_name: "trade_status"
    provenance_badge: "[Inherited: Upstream Source Dictionary]"
    source_spec_ref: "Lifecycle Status Enum / contract.odcs.yaml#trade_status"
    description: >-
      Lifecycle state of the execution event. Must belong to the permitted
      contract enumeration: EXECUTED, CANCELLED, or AMENDED.
    dq_rules:
      - "Validity: trade_status must be EXECUTED, CANCELLED, or AMENDED"

derived_columns:
  - column_name: notional_value
    data_type: NUMERIC
    sql_expression: "ROUND(price * volume, 2)"
    provenance_badge: "[Platform-Derived: Steward Authored (AI-Assisted Pattern)]"
    governance_layer: platform-steward
    source_spec_ref: "Curated View Expression: ROUND(price * volume, 2)"
    description: >-
      Gross settlement notional value (NUMERIC) computed in the curated
      warehouse view as ROUND(price * volume, 2). Illustrates the governance
      separation where platform-derived analytical columns use steward-approved
      AI-assisted documentation while upstream wire fields remain 100% locked to
      the Source Dictionary.
    dq_rules:
      - "Validity: Trade price must be strictly positive (> 0)"
      - "Validity: Trade volume must be strictly positive (> 0)"

  - column_name: wash_trade_flag
    data_type: BOOL
    sql_expression: "(buyer_id = seller_id)"
    provenance_badge: "[Platform-Derived: Steward Authored (AI-Assisted Pattern)]"
    governance_layer: platform-steward
    source_spec_ref: "Curated View Expression: (buyer_id = seller_id)"
    description: >-
      Boolean surveillance indicator computed as (buyer_id = seller_id). Always
      evaluates to FALSE on certified rows inside equity_trades_curated (since
      self-matches are excluded by the view's WHERE buyer_id != seller_id
      predicate) and TRUE when evaluated on uncurated wash-trade rows in
      equity_trades.
    dq_rules:
      - "Integrity: Anti-wash trading rule - buyer_id must not equal seller_id"
