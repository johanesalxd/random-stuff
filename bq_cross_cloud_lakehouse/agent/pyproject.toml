[project]
name = "froyo-lakehouse-ca-agent"
version = "0.1.0"
description = "Self-contained Conversational Analytics API + Gemini Enterprise data agent for the Froyo cross-cloud lakehouse demo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-cloud-geminidataanalytics>=0.9.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
